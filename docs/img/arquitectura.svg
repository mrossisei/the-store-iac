<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2937"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/>
    </marker>
    <style>
      text { fill: #111827; }
      .h1 { font-size: 19px; font-weight: 700; }
      .h2 { font-size: 15px; font-weight: 700; }
      .h3 { font-size: 13px; font-weight: 700; }
      .t  { font-size: 12px; fill: #4b5563; }
      .m  { font-family: 'DejaVu Sans Mono', monospace; font-size: 11.5px; fill: #374151; }
      .host { fill: #f9fafb; stroke: #6b7280; stroke-width: 1.5; stroke-dasharray: 6 4; }
      .net  { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 1.8; }
      .node { fill: #fefce8; stroke: #a16207; stroke-width: 1.4; }
      .ns   { fill: #ffffff; stroke: #047857; stroke-width: 1.6; stroke-dasharray: 5 3; }
      .app  { fill: #ecfdf5; stroke: #047857; stroke-width: 1.3; }
      .front{ fill: #fef2f2; stroke: #b91c1c; stroke-width: 1.4; }
      .data { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 1.3; }
      .box  { fill: #ffffff; stroke: #374151; stroke-width: 1.3; }
      .f    { stroke: #1f2937; stroke-width: 1.5; fill: none; marker-end: url(#a); }
      .fr   { stroke: #b91c1c; stroke-width: 2; fill: none; marker-end: url(#ar); }
      .lr   { font-size: 11.5px; fill: #b91c1c; font-weight: 700; }
    </style>
  </defs>

  <text x="20" y="26" class="h1">The Store — Arquitectura del POC (Terraform → Docker → Kubernetes)</text>

  <!-- Host -->
  <rect x="18" y="42" width="1164" height="734" rx="8" class="host"/>
  <text x="32" y="62" class="h2">Máquina host — Ubuntu 24.04 · Docker · Terraform</text>

  <!-- Navegador -->
  <rect x="32" y="74" width="330" height="46" rx="5" class="box"/>
  <text x="44" y="92" class="h3">Usuario (navegador)</text>
  <text x="44" y="111" class="m">http://the-store.localhost → 127.0.0.1:80</text>

  <!-- Direcciones -->
  <rect x="700" y="74" width="470" height="46" rx="5" class="box"/>
  <text x="712" y="92" class="h3">Bloques de direcciones (todos privados y disjuntos)</text>
  <text x="712" y="111" class="m">nodos 172.30.0.0/24 · pods 10.244.0.0/16 · Services 10.96.0.0/16</text>

  <!-- Red docker -->
  <rect x="32" y="136" width="1138" height="628" rx="8" class="net"/>
  <text x="46" y="158" class="h2">Red Docker «kind» — bridge (switch L2) + NAT — 172.30.0.0/24 — gateway 172.30.0.1</text>

  <!-- Nodos -->
  <rect x="48" y="172" width="356" height="72" rx="5" class="node"/>
  <text x="60" y="191" class="h3">nodo control-plane (borde)</text>
  <text x="60" y="209" class="m">172.30.0.2 (ej.) · pods 10.244.0.0/24</text>
  <text x="60" y="227" class="t">Ingress Controller (nginx): publica :80 y :443</text>

  <rect x="420" y="172" width="356" height="72" rx="5" class="node"/>
  <text x="432" y="191" class="h3">nodo worker-1</text>
  <text x="432" y="209" class="m">172.30.0.3 (ej.) · pods 10.244.1.0/24</text>
  <text x="432" y="227" class="t">Debian 12 · containerd · kubelet v1.35</text>

  <rect x="792" y="172" width="362" height="72" rx="5" class="node"/>
  <text x="804" y="191" class="h3">nodo worker-2</text>
  <text x="804" y="209" class="m">172.30.0.4 (ej.) · pods 10.244.2.0/24</text>
  <text x="804" y="227" class="t">Debian 12 · containerd · kubelet v1.35</text>

  <!-- Namespace -->
  <rect x="48" y="274" width="1106" height="474" rx="8" class="ns"/>
  <text x="370" y="296" class="h2">namespace the-store — los pods se reparten entre los nodos worker</text>

  <!-- UI -->
  <rect x="62" y="316" width="272" height="76" rx="5" class="front"/>
  <text x="74" y="336" class="h3">ui  (×2 réplicas)</text>
  <text x="74" y="354" class="t">Java / Spring Boot · puerto 8080</text>
  <text x="74" y="372" class="t">Service ClusterIP :80 → pods :8080</text>
  <text x="74" y="387" class="t">capa frontend</text>

  <!-- Backends -->
  <rect x="62" y="436" width="248" height="74" rx="5" class="app"/>
  <text x="74" y="456" class="h3">catalog</text>
  <text x="74" y="474" class="t">Go · catálogo de productos</text>
  <text x="74" y="492" class="t">capa backend</text>

  <rect x="330" y="436" width="248" height="74" rx="5" class="app"/>
  <text x="342" y="456" class="h3">carts</text>
  <text x="342" y="474" class="t">Java · carrito de compras</text>
  <text x="342" y="492" class="t">almacenamiento en memoria</text>

  <rect x="598" y="436" width="248" height="74" rx="5" class="app"/>
  <text x="610" y="456" class="h3">orders</text>
  <text x="610" y="474" class="t">Java · órdenes de compra</text>
  <text x="610" y="492" class="t">capa backend</text>

  <rect x="866" y="436" width="274" height="74" rx="5" class="app"/>
  <text x="878" y="456" class="h3">checkout</text>
  <text x="878" y="474" class="t">Node.js · proceso de compra</text>
  <text x="878" y="492" class="t">capa backend</text>

  <!-- Bases de datos -->
  <rect x="62" y="590" width="248" height="74" rx="5" class="data"/>
  <text x="74" y="610" class="h3">catalog-db</text>
  <text x="74" y="628" class="t">MariaDB · protocolo MySQL</text>
  <text x="74" y="646" class="m">3306 · 1 Gi · sólo desde catalog</text>

  <rect x="598" y="590" width="248" height="74" rx="5" class="data"/>
  <text x="610" y="610" class="h3">orders-db</text>
  <text x="610" y="628" class="t">PostgreSQL</text>
  <text x="610" y="646" class="m">5432 · 1 Gi · sólo desde orders</text>

  <rect x="866" y="590" width="274" height="74" rx="5" class="data"/>
  <text x="878" y="610" class="h3">checkout-db</text>
  <text x="878" y="628" class="t">Redis · protocolo RESP</text>
  <text x="878" y="646" class="m">6379 · 1 Gi · sólo desde checkout</text>

  <!-- Flechas: usuario -> nodo borde -->
  <path d="M 150 120 L 150 172" class="fr"/>
  <text x="162" y="133" class="lr">1. DNAT: puerto 80 del host → nodo de borde</text>

  <!-- borde -> ui -->
  <path d="M 150 244 L 150 316" class="fr"/>
  <text x="160" y="270" class="lr">2. Ingress: Host the-store.localhost → Service ui</text>

  <!-- ui -> backends -->
  <path d="M 150 392 L 150 436" class="f"/>
  <path d="M 230 392 L 230 414 L 454 414 L 454 436" class="f"/>
  <path d="M 260 392 L 260 420 L 722 420 L 722 436" class="f"/>
  <path d="M 290 392 L 290 426 L 1003 426 L 1003 436" class="f"/>
  <text x="330" y="408" class="t">la UI consulta a los cuatro backends por HTTP (puerto 8080) usando sus nombres DNS internos</text>

  <!-- checkout -> orders -->
  <path d="M 866 480 L 846 480" class="f"/>
  <text x="700" y="533" class="t">checkout → orders</text>

  <!-- backends -> dbs -->
  <path d="M 150 510 L 150 590" class="f"/>
  <text x="160" y="556" class="t">MySQL 3306</text>
  <path d="M 700 510 L 700 590" class="f"/>
  <text x="710" y="570" class="t">PostgreSQL 5432</text>
  <path d="M 1003 510 L 1003 590" class="f"/>
  <text x="1013" y="556" class="t">RESP 6379</text>

  <!-- Nota -->
  <text x="62" y="694" class="t">Segmentación (NetworkPolicies): por defecto ningún pod acepta conexiones; la UI sólo acepta tráfico del Ingress Controller; los backends sólo de la UI y de</text>
  <text x="62" y="712" class="t">otros backends; cada base de datos sólo de su microservicio; un servicio en cuarentena no recibe ni inicia conexiones. Salida a Internet: SNAT del gateway → host.</text>
  <text x="62" y="736" class="t">IPs de los nodos asignadas por Docker al crearlos (ej.: .2 a .4). SO: nodos Debian 12 · microservicios Amazon Linux 2023 · bases Ubuntu/Alpine · contraseñas generadas por Terraform.</text>
</svg>
