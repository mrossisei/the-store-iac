<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
    <marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f5fa8"/>
    </marker>
  </defs>
  <rect width="1200" height="900" fill="#ffffff"/>

  <!-- Internet e Internet Gateway -->
  <ellipse cx="530" cy="40" rx="78" ry="26" fill="#dbeafe" stroke="#333" stroke-width="1.5"/>
  <text x="530" y="45" text-anchor="middle" font-weight="600">Internet</text>
  <rect x="450" y="95" width="160" height="40" rx="8" fill="#dbeafe" stroke="#333" stroke-width="1.5"/>
  <text x="530" y="120" text-anchor="middle">Internet Gateway</text>
  <line x1="530" y1="66" x2="530" y2="95" stroke="#333" stroke-width="1.5" marker-start="url(#ah)" marker-end="url(#ah)"/>

  <!-- VPC -->
  <rect x="40" y="165" width="960" height="635" rx="12" fill="none" stroke="#333" stroke-width="1.8"/>
  <text x="330" y="190" font-weight="700">VPC 10.0.0.0/16 &#8212; us-east-1</text>

  <!-- Zonas de disponibilidad -->
  <rect x="60" y="205" width="450" height="580" rx="10" fill="none" stroke="#999" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="285" y="226" text-anchor="middle" font-weight="700">Zona de disponibilidad us-east-1a</text>
  <rect x="530" y="205" width="450" height="580" rx="10" fill="none" stroke="#999" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="755" y="226" text-anchor="middle" font-weight="700">Zona de disponibilidad us-east-1b</text>

  <!-- Subredes publicas -->
  <rect x="75" y="238" width="420" height="84" rx="8" fill="#f0f7ff" stroke="#555" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="488" y="256" text-anchor="end" font-weight="600">Subred pública 10.0.0.0/24</text>
  <rect x="545" y="238" width="420" height="84" rx="8" fill="#f0f7ff" stroke="#555" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="638" y="256" font-weight="600">Subred pública 10.0.1.0/24</text>
  <rect x="95" y="268" width="160" height="44" rx="8" fill="#c7d2fe" stroke="#333" stroke-width="1.5"/>
  <text x="175" y="286" text-anchor="middle">NAT Gateway</text>
  <text x="175" y="303" text-anchor="middle" font-size="12">(IP elástica, SNAT)</text>
  <rect x="300" y="268" width="460" height="44" rx="8" fill="#c7d2fe" stroke="#333" stroke-width="1.5"/>
  <text x="530" y="286" text-anchor="middle">Network Load Balancer</text>
  <text x="530" y="303" text-anchor="middle" font-size="12">(una IP pública por zona, TCP/80)</text>

  <!-- IGW <-> NLB, NAT -> IGW -->
  <line x1="530" y1="135" x2="530" y2="268" stroke="#333" stroke-width="1.5" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <text x="538" y="160" font-size="12">HTTP</text>
  <polyline points="175,268 175,115 450,115" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="190" y="108" font-size="12">salida a Internet de las subredes privadas</text>

  <!-- Subredes privadas -->
  <rect x="75" y="340" width="420" height="435" rx="8" fill="#f7f7f7" stroke="#555" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="88" y="358" font-weight="600">Subred privada 10.0.16.0/20</text>
  <rect x="545" y="340" width="420" height="435" rx="8" fill="#f7f7f7" stroke="#555" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="638" y="358" font-weight="600">Subred privada 10.0.32.0/20</text>

  <!-- Cluster EKS -->
  <rect x="90" y="372" width="875" height="268" rx="10" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="105" y="392" font-weight="600">Clúster EKS (Kubernetes 1.34)</text>
  <rect x="105" y="402" width="385" height="223" rx="8" fill="#fcfcfc" stroke="#666" stroke-width="1.2"/>
  <text x="118" y="420" font-size="12" font-weight="600">Nodo 1 &#183; t3.medium &#183; Amazon Linux 2023</text>
  <rect x="560" y="402" width="390" height="223" rx="8" fill="#fcfcfc" stroke="#666" stroke-width="1.2"/>
  <text x="573" y="420" font-size="12" font-weight="600">Nodo 2 &#183; t3.medium &#183; Amazon Linux 2023</text>

  <!-- Ingress controller (nodo 1) -->
  <rect x="300" y="432" width="170" height="38" rx="8" fill="#e5e7eb" stroke="#333" stroke-width="1.5"/>
  <text x="385" y="456" text-anchor="middle" font-size="13">Ingress Controller (nginx)</text>
  <polyline points="530,312 530,330 385,330 385,432" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- Pods -->
  <rect x="125" y="480" width="110" height="44" rx="8" fill="#bfdbfe" stroke="#333" stroke-width="1.5"/>
  <text x="180" y="507" text-anchor="middle" font-weight="600">UI</text>
  <rect x="580" y="480" width="110" height="44" rx="8" fill="#bfdbfe" stroke="#333" stroke-width="1.5"/>
  <text x="635" y="507" text-anchor="middle" font-weight="600">UI</text>
  <rect x="125" y="565" width="110" height="44" rx="8" fill="#fecaca" stroke="#333" stroke-width="1.5"/>
  <text x="180" y="592" text-anchor="middle" font-weight="600">Catalog</text>
  <rect x="255" y="565" width="110" height="44" rx="8" fill="#fef08a" stroke="#333" stroke-width="1.5"/>
  <text x="310" y="592" text-anchor="middle" font-weight="600">Cart</text>
  <rect x="580" y="565" width="110" height="44" rx="8" fill="#bbf7d0" stroke="#333" stroke-width="1.5"/>
  <text x="635" y="592" text-anchor="middle" font-weight="600">Orders</text>
  <rect x="725" y="565" width="110" height="44" rx="8" fill="#ddd6fe" stroke="#333" stroke-width="1.5"/>
  <text x="780" y="592" text-anchor="middle" font-weight="600">Checkout</text>

  <!-- Ingress -> UI (ambas replicas) -->
  <polyline points="300,451 180,451 180,480" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
  <polyline points="470,451 635,451 635,480" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- UI -> backends -->
  <line x1="180" y1="524" x2="180" y2="545" stroke="#333" stroke-width="1.5"/>
  <line x1="635" y1="524" x2="635" y2="545" stroke="#333" stroke-width="1.5"/>
  <line x1="180" y1="545" x2="780" y2="545" stroke="#333" stroke-width="1.5"/>
  <line x1="180" y1="545" x2="180" y2="565" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="310" y1="545" x2="310" y2="565" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="635" y1="545" x2="635" y2="565" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="780" y1="545" x2="780" y2="565" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="440" y="540" font-size="12">HTTP</text>
  <!-- Checkout -> Orders -->
  <line x1="725" y1="587" x2="690" y2="587" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- Capa de datos -->
  <rect x="90" y="668" width="875" height="100" rx="10" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="330" y="686" font-size="13" font-weight="600">Capa de datos (instancias de una sola zona)</text>
  <rect x="125" y="700" width="110" height="48" rx="8" fill="#fde68a" stroke="#333" stroke-width="1.5"/>
  <text x="180" y="720" text-anchor="middle" font-size="13">RDS MySQL</text>
  <text x="180" y="737" text-anchor="middle" font-size="12">TCP/3306</text>
  <rect x="565" y="700" width="110" height="48" rx="8" fill="#fde68a" stroke="#333" stroke-width="1.5"/>
  <text x="620" y="720" text-anchor="middle" font-size="13">RDS PostgreSQL</text>
  <text x="620" y="737" text-anchor="middle" font-size="12">TCP/5432</text>
  <rect x="715" y="700" width="130" height="48" rx="8" fill="#fde68a" stroke="#333" stroke-width="1.5"/>
  <text x="780" y="720" text-anchor="middle" font-size="13">ElastiCache Redis</text>
  <text x="780" y="737" text-anchor="middle" font-size="12">TCP/6379</text>
  <line x1="180" y1="609" x2="180" y2="700" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="635" y1="609" x2="635" y2="700" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="780" y1="609" x2="780" y2="700" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- Servicios regionales fuera de la VPC -->
  <rect x="215" y="812" width="585" height="76" rx="10" fill="none" stroke="#1f5fa8" stroke-width="1.2" stroke-dasharray="6 4"/>
  <rect x="255" y="822" width="110" height="34" rx="8" fill="#e0f2fe" stroke="#1f5fa8" stroke-width="1.5"/>
  <text x="310" y="844" text-anchor="middle">DynamoDB</text>
  <rect x="629" y="822" width="110" height="34" rx="8" fill="#e0f2fe" stroke="#1f5fa8" stroke-width="1.5"/>
  <text x="684" y="844" text-anchor="middle">SQS</text>
  <text x="507" y="878" text-anchor="middle" font-size="12" fill="#1f5fa8">Servicios regionales de AWS: fuera de la VPC, acceso HTTPS/443 vía NAT Gateway</text>
  <line x1="310" y1="609" x2="310" y2="822" stroke="#1f5fa8" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ahb)"/>
  <line x1="684" y1="609" x2="684" y2="822" stroke="#1f5fa8" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ahb)"/>

  <!-- Plano de control -->
  <rect x="1030" y="470" width="160" height="60" rx="8" fill="#f3f4f6" stroke="#333" stroke-width="1.5"/>
  <text x="1110" y="494" text-anchor="middle" font-size="13">Plano de control EKS</text>
  <text x="1110" y="512" text-anchor="middle" font-size="12">(administrado por AWS)</text>
  <line x1="1030" y1="500" x2="965" y2="500" stroke="#333" stroke-width="1.5" stroke-dasharray="6 4" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <text x="985" y="494" font-size="11">443</text>
</svg>
