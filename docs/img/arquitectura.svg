<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="845" viewBox="0 0 1000 845" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
    <marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f5fa8"/>
    </marker>
  </defs>
  <rect width="1000" height="845" fill="#ffffff"/>

  <!-- Internet -->
  <ellipse cx="210" cy="40" rx="78" ry="26" fill="#dbeafe" stroke="#333" stroke-width="1.5"/>
  <text x="210" y="45" text-anchor="middle" font-weight="600">Internet</text>

  <!-- Internet Gateway -->
  <rect x="130" y="95" width="160" height="40" rx="8" fill="#dbeafe" stroke="#333" stroke-width="1.5"/>
  <text x="210" y="120" text-anchor="middle">Internet Gateway</text>
  <line x1="210" y1="66" x2="210" y2="95" stroke="#333" stroke-width="1.5" marker-start="url(#ah)" marker-end="url(#ah)"/>

  <!-- VPC -->
  <rect x="40" y="165" width="720" height="555" rx="12" fill="none" stroke="#333" stroke-width="1.8"/>
  <text x="290" y="190" font-weight="700">VPC 10.0.0.0/16 &#8212; us-east-1</text>

  <!-- Subredes publicas -->
  <rect x="60" y="205" width="680" height="105" rx="10" fill="#f0f7ff" stroke="#555" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="75" y="227" font-weight="600">Subredes públicas: 10.0.0.0/24 (us-east-1a) &#183; 10.0.1.0/24 (us-east-1b)</text>
  <rect x="110" y="245" width="200" height="48" rx="8" fill="#c7d2fe" stroke="#333" stroke-width="1.5"/>
  <text x="210" y="265" text-anchor="middle">Network Load Balancer</text>
  <text x="210" y="283" text-anchor="middle" font-size="12">(IP pública, TCP/80)</text>
  <rect x="500" y="245" width="200" height="48" rx="8" fill="#c7d2fe" stroke="#333" stroke-width="1.5"/>
  <text x="600" y="265" text-anchor="middle">NAT Gateway</text>
  <text x="600" y="283" text-anchor="middle" font-size="12">(IP elástica, SNAT)</text>

  <!-- IGW <-> NLB -->
  <line x1="210" y1="135" x2="210" y2="245" stroke="#333" stroke-width="1.5" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <text x="220" y="158" font-size="12">HTTP</text>
  <!-- NAT -> IGW -->
  <polyline points="600,245 600,115 290,115" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="330" y="108" font-size="12">salida a Internet de las subredes privadas</text>

  <!-- Subredes privadas -->
  <rect x="60" y="330" width="680" height="375" rx="10" fill="#f7f7f7" stroke="#555" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="75" y="352" font-weight="600">Subredes privadas: 10.0.16.0/20 (us-east-1a) &#183; 10.0.32.0/20 (us-east-1b) &#8212; sin IP pública</text>

  <!-- Cluster EKS -->
  <rect x="80" y="372" width="640" height="232" rx="10" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="95" y="394" font-weight="600">Clúster EKS (Kubernetes 1.34) &#8212; 2 nodos t3.medium, Amazon Linux 2023</text>

  <!-- Ingress controller -->
  <rect x="120" y="408" width="180" height="40" rx="8" fill="#e5e7eb" stroke="#333" stroke-width="1.5"/>
  <text x="210" y="433" text-anchor="middle">Ingress Controller (nginx)</text>
  <line x1="210" y1="293" x2="210" y2="408" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- UI pod -->
  <rect x="150" y="470" width="120" height="44" rx="8" fill="#bfdbfe" stroke="#333" stroke-width="1.5"/>
  <text x="210" y="497" text-anchor="middle" font-weight="600">UI</text>
  <line x1="210" y1="448" x2="210" y2="470" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- Backends -->
  <rect x="160" y="546" width="120" height="44" rx="8" fill="#fecaca" stroke="#333" stroke-width="1.5"/>
  <text x="220" y="573" text-anchor="middle" font-weight="600">Catalog</text>
  <rect x="300" y="546" width="120" height="44" rx="8" fill="#fef08a" stroke="#333" stroke-width="1.5"/>
  <text x="360" y="573" text-anchor="middle" font-weight="600">Cart</text>
  <rect x="440" y="546" width="120" height="44" rx="8" fill="#bbf7d0" stroke="#333" stroke-width="1.5"/>
  <text x="500" y="573" text-anchor="middle" font-weight="600">Orders</text>
  <rect x="580" y="546" width="120" height="44" rx="8" fill="#ddd6fe" stroke="#333" stroke-width="1.5"/>
  <text x="640" y="573" text-anchor="middle" font-weight="600">Checkout</text>

  <!-- UI -> backends (bus) -->
  <polyline points="210,514 210,530 640,530" fill="none" stroke="#333" stroke-width="1.5"/>
  <line x1="220" y1="530" x2="220" y2="546" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="360" y1="530" x2="360" y2="546" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="500" y1="530" x2="500" y2="546" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="640" y1="530" x2="640" y2="546" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="290" y="526" font-size="12">HTTP</text>
  <!-- Checkout -> Orders -->
  <line x1="580" y1="568" x2="560" y2="568" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- Bases en la VPC -->
  <rect x="160" y="640" width="120" height="48" rx="8" fill="#fde68a" stroke="#333" stroke-width="1.5"/>
  <text x="220" y="660" text-anchor="middle">RDS MySQL</text>
  <text x="220" y="677" text-anchor="middle" font-size="12">TCP/3306</text>
  <rect x="415" y="640" width="130" height="48" rx="8" fill="#fde68a" stroke="#333" stroke-width="1.5"/>
  <text x="480" y="660" text-anchor="middle">RDS PostgreSQL</text>
  <text x="480" y="677" text-anchor="middle" font-size="12">TCP/5432</text>
  <rect x="575" y="640" width="130" height="48" rx="8" fill="#fde68a" stroke="#333" stroke-width="1.5"/>
  <text x="640" y="660" text-anchor="middle">ElastiCache Redis</text>
  <text x="640" y="677" text-anchor="middle" font-size="12">TCP/6379</text>
  <line x1="220" y1="590" x2="220" y2="640" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="480" y1="590" x2="480" y2="640" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="640" y1="590" x2="640" y2="640" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- Servicios regionales fuera de la VPC -->
  <rect x="225" y="745" width="460" height="85" rx="10" fill="none" stroke="#1f5fa8" stroke-width="1.2" stroke-dasharray="6 4"/>
  <rect x="305" y="757" width="110" height="34" rx="8" fill="#e0f2fe" stroke="#1f5fa8" stroke-width="1.5"/>
  <text x="360" y="779" text-anchor="middle">DynamoDB</text>
  <rect x="497" y="757" width="110" height="34" rx="8" fill="#e0f2fe" stroke="#1f5fa8" stroke-width="1.5"/>
  <text x="552" y="779" text-anchor="middle">SQS</text>
  <text x="455" y="815" text-anchor="middle" font-size="12" fill="#1f5fa8">Servicios regionales de AWS: fuera de la VPC, acceso HTTPS/443 vía NAT Gateway</text>
  <line x1="360" y1="590" x2="360" y2="757" stroke="#1f5fa8" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ahb)"/>
  <line x1="552" y1="590" x2="552" y2="757" stroke="#1f5fa8" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ahb)"/>

  <!-- Plano de control -->
  <rect x="790" y="372" width="180" height="60" rx="8" fill="#f3f4f6" stroke="#333" stroke-width="1.5"/>
  <text x="880" y="396" text-anchor="middle">Plano de control EKS</text>
  <text x="880" y="414" text-anchor="middle" font-size="12">(administrado por AWS)</text>
  <line x1="790" y1="402" x2="720" y2="402" stroke="#333" stroke-width="1.5" stroke-dasharray="6 4" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <text x="740" y="395" font-size="11">443</text>

</svg>
